version = 1
SPDX-PackageName = "scene.rs"
SPDX-PackageDownloadLocation = "https://github.com/annejan/scene.rs"

# The page, its style and script, the server config and the model tool.
[[annotations]]
path = ["index.html", "scene.css", "scene.js", ".htaccess", "tools/**", "README.md", "REUSE.toml", ".gitignore"]
SPDX-FileCopyrightText = "Anne Jan Brouwer"
SPDX-License-Identifier = "MIT"

# "Köln", the track of deFEEST's martin demo: synthesised from its tracker score
# (productions/cities/score.txt in https://github.com/annejan/martin, MIT) and encoded here.
[[annotations]]
path = ["music/**"]
SPDX-FileCopyrightText = "Anne Jan Brouwer (deFEEST)"
SPDX-License-Identifier = "MIT"

# The deFEEST logo: the 3D model (extruded from the official vector by martin's
# pipeline/svg_extrude_logo.py), as converted by tools/models.py; and the favicon.
[[annotations]]
path = ["collada/defeest.dae", "models/defeest.bin", "favicon.ico"]
SPDX-FileCopyrightText = "deFEEST"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Bawl-E, BawlSec's mascot and logo, by M42D: the 3D model, as exported and as converted.
[[annotations]]
path = ["collada/bawl-e.dae", "models/bawl-e.bin"]
SPDX-FileCopyrightText = "M42D (BawlSec)"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"
