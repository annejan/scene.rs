# vidr.nl (the annejan.com box): the speedrun board's films. Installed, as root, by
#   tee /etc/apache2/sites-available/vidr.nl-le-ssl.conf < vidr.nl-le-ssl.conf
#   apache2ctl configtest && systemctl reload apache2
# The page: /srv/runfilm/site (server/films/vidr/). The films and queue.json:
# /srv/runfilm/out (render.py's), at /portals/. The C64 demos' films, their disks and films.json:
# /srv/runfilm/c64 (the maintainer copies them there), at /c64/.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vidr.nl
    ServerAlias www.vidr.nl
    DocumentRoot /srv/runfilm/site

    ErrorLog ${APACHE_LOG_DIR}/vidr.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/vidr.nl-access.log combined

    <Directory /srv/runfilm/site>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /portals/ /srv/runfilm/out/
    <Directory /srv/runfilm/out>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    Alias /c64/ /srv/runfilm/c64/
    <Directory /srv/runfilm/c64>
        Options -Indexes
        AllowOverride None
        Require all granted
        AddType application/octet-stream .d64
    </Directory>
    <LocationMatch "^/c64/[^/]+\.json$">
        Header always set Cache-Control "no-cache"
    </LocationMatch>
    <LocationMatch "^/c64/[^/]+\.(mp4|jpg|d64)$">
        Header onsuccess set Cache-Control "public, max-age=3600"
        Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} -ge 400"
    </LocationMatch>

    # The queue, for scene.rs/runs to ask after too; fresh each time.
    <LocationMatch "^/portals/[^/]+\.json$">
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cache-Control "no-cache"
    </LocationMatch>
    # A film can be made again under its name: kept an hour. One not made yet (404):
    # not kept at all, so it shows the moment it is.
    <LocationMatch "^/portals/[^/]+\.(mp4|jpg)$">
        Header onsuccess set Cache-Control "public, max-age=3600"
        Header always set Cache-Control "no-store" "expr=%{REQUEST_STATUS} -ge 400"
    </LocationMatch>

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    <IfModule mod_deflate.c>
        SetEnv no-gzip 1
    </IfModule>

    SSLOpenSSLConfCmd SignatureAlgorithms RSA+SHA256:RSA+SHA384:RSA+SHA512:ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512

SSLCertificateFile /etc/letsencrypt/live/vidr.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/vidr.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
